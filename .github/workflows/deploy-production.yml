name: Deploy Reseva to LangSmith

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type deploy to confirm a production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reseva-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production graph
    if: ${{ inputs.confirm_deploy == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LangGraph CLI
        run: python -m pip install --upgrade langgraph-cli

      - name: Create deployment environment file
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.RESEVA_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: "reseva-production"
          LANGSMITH_DEPLOYMENT_NAME: "reseva"
        run: |
          set -euo pipefail
          : "${ANTHROPIC_API_KEY:?Missing GitHub secret ANTHROPIC_API_KEY}"
          : "${DATABASE_URL:?Missing GitHub secret RESEVA_DATABASE_URL}"
          : "${LANGSMITH_API_KEY:?Missing GitHub secret LANGSMITH_API_KEY}"
          python - <<'PY'
          import os
          from pathlib import Path

          keys = (
              "ANTHROPIC_API_KEY",
              "DATABASE_URL",
              "RESEND_API_KEY",
              "RESEND_FROM_EMAIL",
              "RESEND_FROM_NAME",
              "LANGSMITH_API_KEY",
              "LANGSMITH_TRACING",
              "LANGSMITH_PROJECT",
              "LANGSMITH_DEPLOYMENT_NAME",
          )
          lines = []
          for key in keys:
              value = os.environ.get(key, "")
              if value:
                  # dotenv-compatible double-quoted value; escape slash/quotes/newlines.
                  value = value.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n")
                  lines.append(f'{key}="{value}"')
          Path(".env").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Deploy existing Reseva deployment
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: langgraph deploy --deployment-id 54bd9804-6d09-4d92-b0d8-f3ba5a8ea3fb
